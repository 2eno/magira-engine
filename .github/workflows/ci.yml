name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2
  # Godot 4.7 .NET setzt net8.0 voraus (GodotMinimumRequiredTfm).
  DOTNET_VERSION: 8.0.x

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_DIR: ${{ github.workspace }}/../godot
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Godot-Cache
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Godot .NET laden
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$GODOT_DIR"
          cd "$GODOT_DIR"
          curl -fsSL -o "$name.zip" "$base/$name.zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $name.zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$name.zip"
          rm "$name.zip" SHA512-SUMS.txt

      - name: GODOT setzen
        run: |
          bin="$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$bin"
          "$bin" --version
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: C#-Projekt bauen
        run: dotnet build game/game.csproj

      - name: Projekt headless importieren
        run: '"$GODOT" --headless --path game --import'

      - name: Tests
        run: ./scripts/test.sh
